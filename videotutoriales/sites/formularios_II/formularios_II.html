<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios II</title>
  </head>
  <body>
    <h1>Tipos de Inputs</h1>
    <form action="procesa.php" method="get">
      <fieldset>
        <legend>Datos Personales</legend>
        <p>
          <label for="nombre">Nombre:</label><br />
          <input type="text" id="nombre" name="Name" maxlength="6" />
        </p>
        <p>
          <label for="passwd">Contraseña: </label>
          <br /><input
            type="password"
            id="passwd"
            name="contraseña"
            maxlength="6"
          />
        </p>
        <p>
          <label for="hombre2">Hombre: </label
          ><input type="radio" name="genero" id="hombre2" value="H" checked />
          <label for="mujer2">Mujer: </label
          ><input type="radio" name="genero" id="mujer2" value="M" />
        </p>
        <p>
          <label for="fumador">Fumador: </label
          ><input type="checkbox" name="fumador" id="fumador" />
        </p>
      </fieldset>
      <p>
        <label for="nacionalidad">provincia: </label
        ><select name="provincia" id="provincia">
          <option value=""></option>
          <option value="to">Toledo</option>
          <option value="cr">Ciudad Real</option>
          <option value="cu">Cuenca</option>
          <option value="gu">Guadalajara</option>
          <option value="alb">Albacete</option>
        </select>
      </p>
      <p><label for="obsv">Observaciones: </label></p>
      <textarea name="obsv" id="obsv" cols="10" rows="6">
Escriba algo ... </textarea
      >
      <p>
        <label for="color">Color: </label><br /><input
          type="color"
          name="color"
          id="color"
        />
      </p>
      <p>
        <label for="date">Fecha de Nacimiento: </label
        ><input type="date" name="date" id="date" />
      </p>
      <p>
        <label for="edad">Edad: </label
        ><input type="number" name="edad" id="edad" min="0" max="100" />
      </p>
      <p>
        <label for="email">Email: </label
        ><input type="email" name="email" id="email" />
      </p>
      <p>
        <label for="file">Adjuntar foto: </label><br /><input
          type="file"
          name="file"
          id="file"
        />
      </p>
      <br /><br />
      <!-- Botones de envío y reset -->
      <input type="submit" name="Enviar" id="enviar2" />
      <input type="reset" name="reset" id="reset" />
    </form>
  </body>
</html>
