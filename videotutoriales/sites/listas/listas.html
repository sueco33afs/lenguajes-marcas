<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas</title>
  </head>
  <body>
    <h1>Lista Ordenada</h1>

    <ol type="a">
      <li>Abrir el editor</li>
      <li>Crear una página nueva</li>
      <li>Guardarla como .html</li>
      <li>Publicarla en un servidor</li>
    </ol>
    <hr />
    <h1>Lista sin ordenar <strong>'ul'</strong></h1>
    <p>
      Las listas no ordenadas se crean con la etiqueta 'ul' - unordered list -
    </p>
    <p>Ejemplo:</p>
    <ul style="list-style-type: circle">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>PHP</li>
    </ul>
  </body>
</html>
