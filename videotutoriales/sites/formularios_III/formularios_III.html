<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios II</title>
  </head>
  <body>
    <h1>Tipos de Inputs</h1>
    <form action="procesa.php" method="get">
      <fieldset>
        <legend>Datos Personales</legend>
        <p>
          <label for="nombre">Nombre:</label><br />
          <input
            type="text"
            id="nombre"
            name="Name"
            maxlength="6"
            placeholder="Escriba su nombre completo"
            required
            autofocus
          />
        </p>
        <p>
          <label for="pob">Población:</label><br />
          <input
            type="text"
            id="pob"
            name="pob"
            maxlength="50"
            value="Alcazar de San Juan"
            disabled
            readonly
          />
        </p>
        <p>
          <label for="passwd">Contraseña: </label>
          <br /><input
            type="password"
            id="passwd"
            name="contraseña"
            maxlength="6"
            minlength="4"
          />
        </p>
        <p>
          <label for="hombre2">Hombre: </label
          ><input type="radio" name="genero" id="hombre2" value="H" checked />
          <label for="mujer2">Mujer: </label
          ><input type="radio" name="genero" id="mujer2" value="M" />
        </p>
        <p>
          <label for="fumador">Fumador: </label
          ><input type="checkbox" name="fumador" id="fumador" checked />
        </p>
      </fieldset>
      <br /><br />
      <!-- Botones de envío y reset -->
      <input type="submit" name="Enviar" id="enviar2" />
      <input type="reset" name="reset" id="reset" />
    </form>
  </body>
</html>
