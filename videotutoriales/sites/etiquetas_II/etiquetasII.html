<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alberto Fernández Sánchez" />
    <meta name="keywords" content="html, video, css" />
    <meta
      name="description"
      content="Introducción a las etiquetas audio, vide,favicon,iframe y meta"
    />
    <meta name="robots" content="noindex" />
    <title>Etiquetas video y audio y iframe</title>
    <link
      rel="icon"
      href="images/favicon-32x32.png"
      sizes="32x32"
      type="image/png"
    />
  </head>
  <body>
    <h1>Etiqueta Video</h1>
    <video poster="images/molinos-de-alcazar-de.jpg" controls width="400">
      <source src="videos/Publicar20s.mp4" type="video/mp4" />
      <source src="videos/Publicar20s.ogv" type="video/ogv" />
      <source src="videos/Publicar20s.webm" type="video/webm" />
    </video>
    <h2>Etiqueta Audio</h2>
    <audio src="audios/audio.mp3" controls>
      <source src="audios/audio.mp3" />
      ERROR, formato no soportado.
    </audio>
    <hr />
    <h1>iFrames</h1>
    <iframe width="500" src="https://www.marca.com" frameborder="0"></iframe>
    <iframe width="500" src="https://www.elmundo.com" frameborder="0"></iframe>
    <iframe width="500" src="https://www.elpais.com" frameborder="0"></iframe>
    <hr />
    <h1>Video del IES Juan Bosco</h1>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/qhXUHkhzqb0?si=7lH_yxK4cz1JHEpb"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <hr />
    <h1>Mapa de Google Maps</h1>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3978.76449349679!2d-3.2244833233984744!3d39.391500717398905!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd69af036cec6af9%3A0x3cb32e283081ecee!2sIES%20Juan%20Bosco!5e1!3m2!1sen!2ses!4v1795629570171!5m2!1sen!2ses"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <hr />
  </body>
</html>
