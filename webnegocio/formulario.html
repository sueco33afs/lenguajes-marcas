<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Información</title>
    <style>
      body {
        background-color: antiquewhite;
      }
      h1 {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 25px;
        color: brown;
      }
      label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
      }
      footer {
        margin-top: 75px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Formulario de Información</h1>
      <form action="formulario.php" method="post">
        <fieldset>
          <legend>Sus Datos</legend>
          <p>
            <label for="name">Nombre y apellidos: </label>
            <input type="text" id="name" name="name" maxlength="50" required />
          </p>
          <p>
            <label for="passwd">Contraseña: </label>
            <input type="password" maxlength="8" />
          </p>
          <p>
            <label for="user">Usuario: </label>
            <input
              type="text"
              id="user"
              name="user"
              maxlength="25"
              disabled
              placeholder="anónimo"
            /><br /><br />
          </p>
          <label for="level">Nivel :</label><br /><br />
          <input type="radio" name="level" value="profesional" checked />
          Profesional <br /><br />
          <input type="radio" name="level" value="Avanzado" /> Avanzado
          <br /><br />
          <input type="radio" name="level" value="Avanzado" /> Principiante
          <br /><br />
        </fieldset>
        <br /><br />
        <p>
          <label for="nacionalidad">Nacionalidad: </label>
          <select name="nacionalidad" id="nacionalidad">
            <option value="ES">España</option>
            <option value="POR">Portugal</option>
            <option value="FR">Francia</option>
            <option value="IT">Italia</option>
            <option value="AL">Alemania</option>
          </select>
        </p>
        <br />
        <p>
          <label for="description">Descripción: </label>
          <textarea name="descripción" rows="7" cols="30"></textarea>
        </p>
        <br />
        <p>
          <input type="checkbox" name="info" checked /> Deseo recibir
          información sobre novedades y ofertas. <br /><br />
          <input type="checkbox" name="legal" /> Declaro haber leido y aceptar
          las condiciones generales del programa y la normativa sobre protección
          de datos.
        </p>
        <br />
        <p>Adjuntar archivo: <input type="file" name="archivo" /></p>
        <br /><br />
        <input type="submit" name="submit" value="Enviar" />
        <input type="reset" name="reset" value="Borrar datos" />
      </form>
    </main>

    <footer>
      <a href="index.html">Volver a la página principal</a>
    </footer>
  </body>
</html>
